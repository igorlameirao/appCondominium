<div
  class="app-premium-shell"
  [class.app-premium-shell--authed]="shouldShowMenu()"
  [class.app-premium-shell--sidebar-collapsed]="shouldShowMenu() && sidebarCollapsed">
  <aside *ngIf="shouldShowMenu()" class="app-premium-sidebar" [class.app-premium-sidebar--open]="mobileMenuOpen">
    <div class="app-premium-sidebar__head">
      <div class="app-premium-brand">
        <div class="app-premium-brand__title">AppCondominium</div>
        <div class="app-premium-brand__sub" *ngIf="nomeCondominioAtivo">{{ nomeCondominioAtivo }}</div>
      </div>
    </div>
    <nav class="app-premium-sidebar__nav">
      <div *ngFor="let group of menuGroups" class="sidebar-group" [hidden]="!visibleLinks(group).length">
        <button type="button" class="sidebar-group__trigger" (click)="toggleGroup(group.label)">
          <span class="sidebar-group__title">{{ group.label }}</span>
        </button>
        <div class="sidebar-group__links" *ngIf="isGroupOpen(group.label)">
          <a *ngFor="let link of visibleLinks(group)" [routerLink]="link.route" routerLinkActive="sidebar-link--active" class="sidebar-link">{{ link.label }}</a>
        </div>
      </div>
    </nav>
    <div class="sidebar-group" *ngIf="podeGerenciar()">
        <a routerLink="/gerenciamento-permissoes" routerLinkActive="sidebar-link--active" class="sidebar-link">Permissões</a>
      </div>
      <div class="app-premium-sidebar__foot">
      <label class="tenant-switch" *ngIf="condominiosAutorizados.length > 1">
        <span>Condomínio</span>
        <select [ngModel]="condominioCtx.idCondominio" (ngModelChange)="trocarTenant($event)">
          <option *ngFor="let c of condominiosAutorizados" [ngValue]="c.idCondominio">{{ c.nome }}</option>
        </select>
      </label>
      <button type="button" class="sidebar-logout" (click)="logout()">Sair</button>
    </div>
  </aside>

  <div class="app-premium-stage">
    <header *ngIf="shouldShowMenu()" class="app-premium-topstrip">
      <button type="button" class="app-premium-burger" (click)="mobileMenuOpen = !mobileMenuOpen" aria-label="Menu">☰</button>
      <div class="app-premium-topstrip-brand">Administração de Condomínios</div>
    </header>
    <main class="app-premium-main">
      <div class="content-wrapper" [class.content-wrapper--list-hug]="hugShell()">
        <div class="content-card"
          [class.content-card-entity-list]="isEntityListRoute()"
          [class.content-card-entity-form]="isEntityFormRoute()">
          <router-outlet />
        </div>
      </div>
    </main>
  </div>
</div>
<app-push-toast />
