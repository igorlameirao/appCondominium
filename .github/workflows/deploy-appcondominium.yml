name: Deploy AppCondominium (AWS)

on:
  workflow_dispatch:
    inputs:
      ref:
        description: Branch, tag ou SHA para publicar
        required: false
        default: main

permissions:
  id-token: write
  contents: read

concurrency:
  group: deploy-appcondominium-production
  cancel-in-progress: false

env:
  DOTNET_VERSION: "8.0.x"
  NODE_VERSION: "20"
  API_PROJECT: WebApi/AppCondominium.API/AppCondominium.API.csproj
  FRONTEND_DIR: frontend

jobs:
  build-and-deploy:
    name: Build, S3 e SSM
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref || 'main' }}

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: ${{ env.FRONTEND_DIR }}/package-lock.json

      - name: dotnet publish (API)
        run: |
          dotnet publish "${{ env.API_PROJECT }}" -c Release -o ./artifacts/publish-api

      - name: npm ci e build (frontend)
        working-directory: ${{ env.FRONTEND_DIR }}
        run: |
          npm ci
          npm run build

      - name: Empacotar artefatos
        run: |
          mkdir -p artifacts/packages
          (cd artifacts/publish-api && zip -r ../packages/api.zip .)
          (cd "${{ env.FRONTEND_DIR }}/dist/frontend/browser" && zip -r ../../../artifacts/packages/frontend.zip .)
          cp scripts/ec2-deploy-appcondominium.sh artifacts/packages/ec2-deploy-appcondominium.sh
          unzip -tq artifacts/packages/api.zip
          unzip -tq artifacts/packages/frontend.zip
          test -f artifacts/packages/ec2-deploy-appcondominium.sh

      - name: Configurar credenciais AWS (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Publicar no S3
        env:
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
        run: |
          PREFIX="releases/${GITHUB_SHA}"
          aws s3 cp artifacts/packages/api.zip "s3://${DEPLOY_BUCKET}/${PREFIX}/api.zip"
          aws s3 cp artifacts/packages/frontend.zip "s3://${DEPLOY_BUCKET}/${PREFIX}/frontend.zip"
          aws s3 cp artifacts/packages/ec2-deploy-appcondominium.sh "s3://${DEPLOY_BUCKET}/${PREFIX}/ec2-deploy-appcondominium.sh"

      - name: Executar deploy na EC2 (SSM)
        id: ssm
        env:
          DEPLOY_BUCKET: ${{ vars.AWS_DEPLOY_BUCKET }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
          AWS_REGION: ${{ vars.AWS_REGION }}
        run: |
          set -euo pipefail
          REMOTE_BOOTSTRAP=$'set -euo pipefail\nexport DEPLOY_SHA='"${GITHUB_SHA}"$'\nexport AWS_DEPLOY_BUCKET='"${DEPLOY_BUCKET}"$'\nexport AWS_DEFAULT_REGION='"${AWS_REGION}"$'\nTMP_SCRIPT=$(mktemp)\naws s3 cp "s3://${AWS_DEPLOY_BUCKET}/releases/${DEPLOY_SHA}/ec2-deploy-appcondominium.sh" "$TMP_SCRIPT"\nchmod +x "$TMP_SCRIPT"\nexec "$TMP_SCRIPT"'
          PARAMS="$(jq -n --arg cmd "$REMOTE_BOOTSTRAP" '{commands: [$cmd]}')"
          COMMAND_ID="$(aws ssm send-command \
            --instance-ids "$INSTANCE_ID" \
            --document-name "AWS-RunShellScript" \
            --comment "AppCondominium deploy ${GITHUB_SHA}" \
            --parameters "$PARAMS" \
            --query 'Command.CommandId' \
            --output text)"
          echo "command_id=${COMMAND_ID}" >> "$GITHUB_OUTPUT"

      - name: Aguardar conclusão do SSM
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          echo "Aguardando comando SSM ${COMMAND_ID}..."
          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID"

      - name: Validar resultado do deploy
        env:
          COMMAND_ID: ${{ steps.ssm.outputs.command_id }}
          INSTANCE_ID: ${{ vars.EC2_INSTANCE_ID }}
        run: |
          set -euo pipefail
          INVOCATION="$(aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "$INSTANCE_ID" \
            --output json)"

          STATUS="$(echo "$INVOCATION" | jq -r '.Status')"
          RESPONSE_CODE="$(echo "$INVOCATION" | jq -r '.ResponseCode')"
          STDOUT="$(echo "$INVOCATION" | jq -r '.StandardOutputContent // empty')"
          STDERR="$(echo "$INVOCATION" | jq -r '.StandardErrorContent // empty')"

          if [[ -n "$STDOUT" ]]; then
            echo "--- stdout (SSM) ---"
            echo "$STDOUT"
          fi
          if [[ -n "$STDERR" ]]; then
            echo "--- stderr (SSM) ---"
            echo "$STDERR"
          fi

          if [[ "$STATUS" != "Success" ]] || [[ "$RESPONSE_CODE" != "0" ]]; then
            echo "Deploy falhou (Status=${STATUS}, ResponseCode=${RESPONSE_CODE})"
            exit 1
          fi

          echo "Deploy concluído com sucesso."
