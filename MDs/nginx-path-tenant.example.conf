# Exemplo Nginx — multi-tenant por caminho (appcondominium.com.br/{identificador}/...)
# Ajuste server_name, certificados e caminhos conforme a EC2.

server {
    listen 443 ssl http2;
    server_name appcondominium.com.br;

    root /var/www/appcondominium-web;
    index index.html;

    # API .NET
    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Arquivos estáticos do build Angular
    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    # SPA: qualquer rota (inclui /{identificador}/inicio, /{identificador}/entrar, etc.)
    location / {
        try_files $uri $uri/ /index.html;
    }
}

